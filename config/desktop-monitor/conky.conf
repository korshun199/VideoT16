-- Системный монитор для Conky на рабочем столе Ubuntu.
-- Окно без заголовка и кнопок; его можно двигать Super + перетаскиванием мышью.
-- Фон панели полупрозрачный, а текст и индикаторы остаются чёткими.
conky.config = {
    -- Размещение при первом запуске: справа сверху с отступом от панели GNOME.
    alignment = 'top_right',
    gap_x = 18,
    gap_y = 54,
    minimum_width = 360,
    maximum_width = 360,
    minimum_height = 0,

    -- Частота обновления и усреднение показателей.
    update_interval = 1.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    text_buffer_size = 2048,

    -- Окно остаётся обычным для GNOME, но заголовок и кнопки рамки скрыты.
    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 128,

    -- Рисование текста поверх полупрозрачного фона.
    background = false,
    double_buffer = true,
    use_xft = true,
    font = 'DejaVu Sans:size=10',
    xftalpha = 1.0,
    default_color = 'e8edf4',
    color1 = '62c6ff',
    color2 = 'ffbd66',
    color3 = '73d69a',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    border_width = 0,
    border_inner_margin = 14,
    short_units = true,
    temperature_unit = 'celsius',
};

conky.text = [[
${font DejaVu Sans:bold:size=13}${color1}СИСТЕМА${color}${font}${alignr}${time %H:%M:%S}
${color1}${hr 1}${color}

${color2}ПРОЦЕССОР${color}${alignr}${cpu}%
${cpubar 8,330}
Температура${alignr}${execi 5 /bin/sh /home/oleg/.config/conky/cpu_temperature.sh}
Частота${alignr}${freq_g} ГГц

${color2}ПАМЯТЬ${color}${alignr}${memperc}%
${membar 8,330}
Использовано${alignr}${mem} / ${memmax}

${color2}НАКОПИТЕЛЬ  /${color}${alignr}${fs_used_perc /}%
${fs_bar 8,330 /}
Свободно${alignr}${fs_free /} из ${fs_size /}

${color2}СЕТЬ  wlo1${color}
Загрузка${alignr}${downspeed wlo1}
Передача${alignr}${upspeed wlo1}
Адрес${alignr}${addr wlo1}

${color2}АККУМУЛЯТОР${color}${alignr}${battery_percent BAT0}%
${color1}${hr 1}${color}
${color3}${top name 1}${alignr}${top cpu 1}% CPU${color}
${top_mem name 1}${alignr}${top_mem mem 1}% RAM
]]
